name: Instagram Reels Factory

on:
  schedule:
    - cron: '0 6,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels-factory
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      USE_MOCK_LLM: '0'
      PUBLISH: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'ru-RU-DmitryNeural' }}
      USE_MUSIC: ${{ vars.USE_MUSIC || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build and optionally publish Reel
        run: python -m reels_factory.pipeline
